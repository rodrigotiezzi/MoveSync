spring.application.name=semaforo-inteligente
server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:mem:semaforo;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.data.web.pageable.max-page-size=100

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL:false}
spring.rabbitmq.listener.simple.default-requeue-rejected=false

spring.ai.openai.api-key=${OPENAI_API_KEY:sem-chave}
spring.ai.openai.base-url=${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
spring.ai.openai.chat.completions-path=${AI_COMPLETIONS_PATH:/chat/completions}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:}
spring.ai.openai.chat.options.temperature=0.3
spring.ai.retry.backoff.initial-interval=1s
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.max-attempts=3
spring.ai.retry.backoff.max-interval=5s
app.ia.habilitada=${IA_HABILITADA:true}


app.jwt.secret=${JWT_SECRET}
app.jwt.expiracao-minutos=120

app.semaforo.validade-leitura-segundos=120

app.semaforo.intervalo-minimo-decisao-segundos=30

springdoc.swagger-ui.path=/swagger-ui.html
